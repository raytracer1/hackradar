<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Logo badge -->
  <rect x="60" y="60" width="80" height="80" rx="20" fill="#6366f1"/>
  <text x="100" y="116" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle">H</text>
  <!-- Brand -->
  <text x="160" y="118" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="700" fill="white">HackRadar</text>
  <!-- Tagline -->
