  <text x="60" y="410" font-family="Inter, system-ui, sans-serif" font-size="32" fill="#a5b4fc">Browse upcoming hackathons from Devpost, MLH,</text>
  <text x="60" y="456" font-family="Inter, system-ui, sans-serif" font-size="32" fill="#a5b4fc">HackerEarth, Devfolio, and more — all in one place.</text>
